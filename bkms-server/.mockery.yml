all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/RimuruChan/blueking-service-governance/bkms-server/pkg/core/env:
    config:
      pkgname: env_test
    interfaces:
      FeatureEnvNamespaceInitializer:
  github.com/RimuruChan/blueking-service-governance/bkms-server/pkg/infras/account/auth:
    interfaces:
      AuthBackend:
  github.com/RimuruChan/blueking-service-governance/bkms-server/pkg/infras/account/usertoken:
    interfaces:
      TokenClient:
        config:
          filename: mocks.go
  github.com/RimuruChan/blueking-service-governance/bkms-server/pkg/workload/misc/portforward:
    interfaces:
      PodClient:
